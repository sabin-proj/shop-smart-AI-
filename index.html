<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSmart AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3ee;color:#252b27;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:40px auto;padding:18px}.panel{background:white;border-radius:22px;padding:32px;box-shadow:0 8px 32px #0000000a}.eyebrow{color:#56735f;font-size:12px;letter-spacing:2px;font-weight:bold}h1{font-size:38px;margin:10px 0}p{color:#656b65;line-height:1.6}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px;font-weight:bold;margin:14px 0 8px}input,select{width:100%;padding:13px;border:1px solid #d8ddd6;border-radius:10px;font-size:15px;background:white}button{width:100%;padding:16px;background:#345742;color:white;border:0;border-radius:12px;margin-top:25px;font-size:16px;font-weight:bold;cursor:pointer}#result{display:none;background:#edf3ed;border-radius:12px;padding:18px;margin-top:20px}#decision{font-size:23px;font-weight:bold}.status{font-size:12px;margin-top:20px;color:#6a746d}@media(max-width:550px){.fields{grid-template-columns:1fr}.panel{padding:22px}h1{font-size:30px}}
</style></head><body><main class="wrap"><section class="panel"><div class="eyebrow">SHOP SMARTER, NOT HARDER</div><h1>ShopSmart AI</h1><p>Thinking of buying something? Answer a few quick questions to get a recommendation from our shopping classifier.</p>
<form id="form"><div class="fields">
<div><label for="category">Item category</label><select id="category"><option>Shirt</option><option>Shoes</option><option>Bag</option><option>Jacket</option><option>Accessory</option></select></div>
<div><label for="price_usd">Item price ($)</label><input type="number" min="0" step="0.01" id="price_usd" required></div>
<div><label for="budget_usd">Your budget ($)</label><input type="number" min="0" step="0.01" id="budget_usd" required></div>
<div><label for="need_level">How much do you need it?</label><select id="need_level"><option>High</option><option>Medium</option><option>Low</option></select></div>
<div><label for="similar_owned">Do you already own something similar?</label><select id="similar_owned"><option>No</option><option>Yes</option><option>Unknown</option></select></div>
<div><label for="use_frequency">How often would you use it?</label><select id="use_frequency"><option>Daily</option><option>Weekly</option><option>Rarely</option><option>Unknown</option></select></div>
<div><label for="style_match">How well does it match your style?</label><select id="style_match"><option>High</option><option>Medium</option><option>Low</option></select></div>
</div><button type="submit">Get my recommendation</button></form>
<div id="result" aria-live="polite"><div id="decision"></div><p id="explanation"></p></div>
<div class="status">{% if connected %}Model file detected. Ready to test.{% else %}Model not connected yet. See README.txt for setup instructions.{% endif %}</div>
</section></main><script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const keys=['category','price_usd','budget_usd','need_level','similar_owned','use_frequency','style_match'];const data={};for(const key of keys){const v=document.getElementById(key).value;data[key]=['price_usd','budget_usd'].includes(key)?Number(v):v;}const box=document.getElementById('result');const title=document.getElementById('decision');const explanation=document.getElementById('explanation');box.style.display='block';title.textContent='Checking…';explanation.textContent='';try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Prediction failed');title.textContent=result.decision;explanation.textContent='Recommendation generated by your trained Orange classifier. Consider your personal needs before deciding.';}catch(err){title.textContent='Unable to predict';explanation.textContent=err.message;}});
</script></body></html>
